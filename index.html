<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OQYRMAN — кітап әлемі</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--ob:#FAF7F2;--iv:#3D312A;--gold:#5B6E58;--wal:#E6DFC8;--ol:#5B6E58;--gr:#3D312Aa6;--pad:clamp(18px,5vw,64px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ob:#FAF7F2}}
:root[data-theme="dark"]{--ob:#FAF7F2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ob);color:var(--iv);font:17px/1.6 "PT Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"PT Serif",Georgia,serif;font-weight:400;line-height:1.08;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.eb{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px var(--pad);background:linear-gradient(#FAF7F2ee,#FAF7F200)}
.lg{font:700 24px "PT Serif",serif;letter-spacing:.2em}
header nav{display:flex;gap:clamp(12px,2.2vw,30px);font-size:15px;align-items:center}
header nav a:hover,.cnt:hover{color:var(--gold)}
.burger{display:none;background:none;border:1px solid var(--gr);border-radius:4px;padding:6px 12px}
@media(max-width:860px){.burger{display:block}header nav{position:fixed;inset:60px 0 auto 0;flex-direction:column;align-items:flex-start;background:var(--ob);padding:20px var(--pad) 28px;gap:18px;font-size:19px;transform:translateY(-130%);transition:transform .3s;border-bottom:1px solid var(--wal)}header nav.open{transform:none}}
.btn{display:inline-block;background:var(--gold);color:var(--ob);padding:13px 26px;border:1px solid var(--gold);font-weight:700;margin:6px 10px 6px 0}
.btn.o{background:none;color:var(--iv);border-color:var(--gr)}
.btn:hover{filter:brightness(1.12)}
.hero{position:relative;height:100vh;min-height:620px;overflow:hidden;background:var(--ob)}
.layers{position:absolute;inset:0}
.layer{position:absolute;left:-6%;right:-6%;bottom:0;display:flex;align-items:flex-end;gap:3px;transform-origin:50% 100%}
.sp{flex:0 0 auto;border-radius:2px 2px 0 0;background:var(--c);box-shadow:inset -3px 0 5px #0008,inset 2px 0 2px #fff2;position:relative}
.sp::before,.sp::after{content:"";position:absolute;left:12%;right:12%;height:2px;background:var(--gold);opacity:.75}
.sp::before{top:12%}.sp::after{top:calc(12% + 7px)}
.l0{opacity:.4;filter:blur(1.5px)}.l1{opacity:.7}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero.gl .layers{display:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#FAF7F2f2 8%,#FAF7F255 55%,#FAF7F200),linear-gradient(0deg,#FAF7F2 0,#FAF7F200 30%);pointer-events:none}
.ht{position:absolute;z-index:2;left:var(--pad);bottom:12vh;max-width:min(680px,88vw)}
.big{font-size:clamp(64px,15vw,210px);letter-spacing:.06em;margin-left:-.04em}
.ht h2{font-size:clamp(26px,4vw,48px);font-style:italic;margin:6px 0 14px}
.sub{color:var(--gr);max-width:38ch;margin:0 0 22px}
section.sc{position:relative;padding:clamp(80px,12vw,150px) var(--pad)}
#feat{min-height:100vh;display:grid;align-items:center;background:linear-gradient(var(--ob),#E2E8DF)}
.fw{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,6vw,90px);align-items:center;max-width:1180px;margin:0 auto;width:100%}
.fb{perspective:1200px;display:grid;place-items:center}
.fb .bk{width:min(300px,62vw)}
.ft h2{font-size:clamp(34px,5vw,64px);margin-bottom:8px}
.ft .by{color:var(--gr)}
.pr{font:700 30px "PT Serif",serif;color:var(--gold);margin:14px 0}
@media(max-width:800px){.fw{grid-template-columns:1fr}}
.bk{position:relative;aspect-ratio:2/3;background:var(--c);border-radius:2px 5px 5px 2px;box-shadow:0 26px 40px -10px #000,inset 0 0 0 1px #fff1;color:#FAF7F2;overflow:hidden;transform-style:preserve-3d}
.bk::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,#0004 0,#fff1 4%,#0000 10%)}
.bk::after{content:"";position:absolute;right:0;top:2%;bottom:2%;width:4px;background:repeating-linear-gradient(0deg,#FAF7F2 0 1px,#E6DFC8 1px 2px)}
.fr{position:absolute;inset:7% 9% 7% 14%;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #FAF7F255;padding:12px;text-align:center}
.fr small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#FAF7F2aa}
.fr b{font:700 clamp(15px,1.7vw,22px)/1.2 "PT Serif",serif}
.fr span{font-size:13px;color:#FAF7F2}
.bk.sm{width:100%}
#coll{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0;background:#E2E8DF}
#coll h2{padding:0 var(--pad);font-size:clamp(34px,5vw,64px);margin-bottom:30px}
.track{display:flex;gap:clamp(20px,3vw,44px);padding:10px var(--pad) 30px;overflow-x:auto;scrollbar-width:thin}
.card{flex:0 0 clamp(170px,22vw,250px)}
.card p{margin:12px 0 0;font-family:"PT Serif",serif;font-size:19px}
.card small{color:var(--gr)}

#gen{background:var(--ob)}
.gr{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:clamp(14px,2.4vw,30px) 0;font:clamp(34px,7vw,92px)/1 "PT Serif",serif;color:var(--gr);transition:color .4s,padding .4s}
.gr small{font:15px "PT Sans",sans-serif;color:var(--gr)}
.gr.on,.gr:hover{color:var(--iv);padding-left:20px}
.endc{text-align:center;background:linear-gradient(var(--ob),var(--wal))}
.endc h2{font-size:clamp(34px,6vw,80px);margin-bottom:28px}
.pg{max-width:1180px;margin:0 auto;padding:130px var(--pad) 90px;min-height:100vh}
.pg h1{font-size:clamp(38px,6vw,76px);margin-bottom:26px}
.bar{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:30px;align-items:end}
.bar label{display:grid;gap:4px;font-size:13px;color:var(--gr)}
input,select,textarea{font:inherit;background:#E2E8DF;color:var(--iv);border:1px solid #E6DFC8;padding:10px 12px;border-radius:2px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:34px 26px}
.grid .ci a.t{display:block;font:19px/1.25 "PT Serif",serif;margin:14px 0 2px}
.ci small{color:var(--gr);display:block}
.ci .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ci .row b{color:var(--gold)}
.ic{background:none;border:1px solid #E6DFC8;padding:6px 12px;border-radius:2px}
.ic.on{color:var(--gold);border-color:var(--gold)}
.none{color:var(--gr);padding:40px 0}
.det{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:clamp(24px,6vw,80px);align-items:start}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:20px 0;color:var(--gr)}
.det dd{margin:0;color:var(--iv)}
@media(max-width:760px){.det{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--wal)}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:32px;height:32px;background:none;border:1px solid #E6DFC8}
.sum{display:flex;justify-content:space-between;font:30px "PT Serif",serif;margin:26px 0;border-top:1px solid var(--gold);padding-top:20px}
form.f{display:grid;gap:16px;max-width:520px}
form.f label{display:grid;gap:5px;font-size:14px;color:var(--gr)}
.err{color:#5B6E58;font-size:14px;min-height:1em}
.note{border:1px solid var(--gold);padding:12px 16px;color:var(--gr);margin:0 0 24px;font-size:15px}
.rd{max-width:560px;margin:0 auto;text-align:center}
.paper{background:var(--iv);color:#3D312A;padding:clamp(24px,5vw,50px);min-height:340px;font:20px/1.7 "PT Serif",serif;text-align:left;box-shadow:0 30px 50px -20px #000;transform-origin:0 50%}
.prog{height:4px;background:#3D312A;margin:20px 0 10px}.prog i{display:block;height:100%;background:var(--gold);width:0}
footer{background:#E2E8DF;padding:30px var(--pad);color:var(--gr);font-size:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--gold);color:var(--ob);padding:10px 20px;opacity:0;transition:.25s;z-index:99;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ld{position:fixed;inset:0;z-index:200;background:var(--ob);display:flex;align-items:center;justify-content:center;padding:0 5vw;cursor:pointer}
#ld .in2{display:flex;width:100%;align-items:center;justify-content:space-between}
.ldt{font-size:clamp(13px,1.2vw,17px);letter-spacing:.18em;color:var(--gr);margin:0;opacity:0}
#ldw{position:relative;width:clamp(48px,6.6vh,76px);height:clamp(72px,10vh,114px)}
.ldi{position:absolute;inset:0;opacity:0}
.ldi .bk{width:100%;box-shadow:0 10px 18px -6px #000}
#ldd{position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);color:var(--gold);letter-spacing:.2em;font-size:14px;margin:0;white-space:nowrap}
#ld .fr{inset:8% 8% 8% 14%;padding:3px}#ld .fr small,#ld .fr span{display:none}#ld .fr b{font-size:8px}
@media(max-width:800px){#ld .in2{flex-direction:column;justify-content:center;gap:16vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.h2t{position:absolute;z-index:3;top:16vh;left:0;right:0;text-align:center;padding:0 var(--pad)}
.h2t h1{font-size:clamp(46px,9vw,120px);font-style:italic}
.h2t .sub{margin:10px auto 0;color:#3D312A}
.tbl{position:absolute;z-index:2;left:0;right:0;bottom:0;height:17vh;background:linear-gradient(#E2E8DF00,#E2E8DF 35%,#FAF7F2)}
.row3d{position:absolute;z-index:3;left:50%;bottom:calc(17vh - 6px);transform:translateX(-50%);display:flex;align-items:flex-end;gap:5px;perspective:1300px;max-width:96vw}
.b3{flex:0 0 auto;width:clamp(18px,3.6vw,58px);height:var(--h);background:linear-gradient(90deg,#0006,#fff2 12%,#0000 30%),var(--c);border:0;border-right:5px solid #FAF7F2;border-top:2px solid #FAF7F2;transform:rotateY(-24deg);transition:transform .35s;box-shadow:0 8px 16px -6px #0004;cursor:pointer;position:relative}
.b3:hover,.b3:focus-visible{transform:translateY(-18px) rotateY(-6deg)}
.b3 span{writing-mode:vertical-rl;position:absolute;inset:16% 0;color:#FAF7F2;font:700 clamp(11px,1.15vw,15px) "PT Serif",serif;text-align:center;overflow:hidden;white-space:nowrap}
.b3::before,.b3::after{content:"";position:absolute;left:10%;right:10%;height:2px;background:#FAF7F2}.b3::before{top:8%}.b3::after{top:calc(8% + 6px)}
.tg{position:absolute;z-index:4;right:var(--pad);bottom:20vh;background:#FAF7F2cc;border:1px solid var(--gold);padding:8px 14px}
#op{position:fixed;inset:0;z-index:150;background:#FAF7F2f2;display:none;align-items:center;justify-content:center;gap:clamp(20px,4vw,60px);padding:70px var(--pad);flex-wrap:wrap;overflow:auto}
#op.show{display:flex}
.sp2{display:flex;perspective:1500px}
.pa{width:clamp(150px,22vw,300px);aspect-ratio:2/3;background:#E2E8DF;color:#3D312A;padding:22px 18px;font-family:"PT Serif",serif;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:0 20px 40px -10px #000}
.pa.l{border-right:1px solid #0003}.pa small{font:12px "PT Sans";letter-spacing:.1em;text-transform:uppercase;color:#3D312A}
.pa h3{font-size:clamp(18px,2vw,26px)}.pa p{font-size:clamp(13px,1.2vw,16px);margin:0}.pa i{display:block;width:20px;height:2px;background:#3D312A;margin:0 auto 6px}
.inf{max-width:380px}.inf h2{font-size:clamp(30px,4vw,50px)}.esc{color:var(--gr);font-size:13px}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:var(--pad);background:none;border:1px solid var(--gr);font-size:26px;width:44px;height:44px}
#toast{z-index:300}
.tg{bottom:4vh}.b3 span{text-overflow:ellipsis}#ld .fr b,#stk .fr b{overflow-wrap:anywhere}
#stk{height:100vh;display:flex;align-items:center;justify-content:center;padding:0 5vw;background:linear-gradient(#E2E8DF 0,#E2E8DF 78%,#FAF7F2 100%);position:relative;overflow:hidden}
#stk .in2{display:flex;width:100%;align-items:center;justify-content:space-between}
#stk .ldt{opacity:1;font-size:clamp(16px,2vw,28px)}
#stw{position:relative;width:clamp(48px,6.6vh,76px);height:clamp(72px,10vh,114px)}
.sti{position:absolute;inset:0;transform:translateY(calc((var(--i) - 3) * 105%))}
.sti .bk{width:100%;box-shadow:0 10px 18px -6px #000}
#std{position:absolute;bottom:5vh;left:50%;transform:translateX(-50%);color:var(--gold);letter-spacing:.2em;font-size:14px;margin:0;white-space:nowrap}
#stk .fr{inset:8% 8% 8% 14%;padding:3px}#stk .fr small,#stk .fr span{display:none}#stk .fr b{font-size:8px}
@media(max-width:800px){#stk .in2{flex-direction:column;justify-content:center;gap:16vh}}
#dw{position:fixed;inset:0;z-index:250;outline:none;cursor:pointer}
#dw svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dwh{position:absolute;z-index:2;font:10px/1 "PT Sans",sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--iv);opacity:.8;pointer-events:none}
#dwm1{left:var(--pad);top:calc(18px + env(safe-area-inset-top,0px))}
#dwc{right:var(--pad);bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right}
#dwn{display:block;font-size:13px;letter-spacing:.16em;font-variant-numeric:tabular-nums;margin-top:6px}
#dwq{left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));opacity:0;white-space:nowrap}
#dw .sk path{fill:none;stroke:#3D312A;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;stroke-linejoin:round}
#coll{height:auto;min-height:100vh;padding:90px 0 30px}
#coll h2{margin-bottom:10px}
.pl{position:relative;height:clamp(480px,74vh,660px);overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none}
